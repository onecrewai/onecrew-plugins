name: Validate marketplace
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pro_version:
        description: Published npm version to verify
        required: true
        default: '0.1.11'
permissions:
  contents: read
jobs:
  launchers:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Prepare published ZIP
        if: github.event_name != 'workflow_dispatch'
        run: node tests/prepare-release.mjs
      - name: Install published npm package
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PRO_VERSION: ${{ inputs.pro_version }}
        run: npm install --global "@onecrew/pro@$PRO_VERSION" --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Locate installed binary
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "ONECREW_TEST_BINARY=$(onecrew-pro --print-binary-path)" >> "$GITHUB_ENV"
          echo "ONECREW_TEST_NPM=1" >> "$GITHUB_ENV"
      - run: node --test tests/*.test.mjs

name: Windows setup acceptance
on:
  workflow_dispatch:
    inputs:
      pro_version:
        description: Published npm package to test
        required: true
        default: '0.1.27'
      binary_version:
        description: Expected application version
        required: true
        default: '0.1.27'
      artifact_tag:
        description: Draft release containing unpublished Windows acceptance artifacts
        required: false
permissions:
  contents: read
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/cache/restore@v4
        id: workbuddy
        with:
          path: .cache/WorkBuddy-5.9.3.exe
          key: workbuddy-win-5.9.3.42398134-d4692421
      - name: Download WorkBuddy 5.9.3
        if: steps.workbuddy.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          curl.exe --fail --location --retry 2 --output .cache/WorkBuddy-5.9.3.exe 'https://acc-1258344699.cos.ap-guangzhou.myqcloud.com/workbuddy/saas/win32-x64-user/WorkBuddy-win32-x64-user-5.9.3.42398134-d4692421.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: steps.workbuddy.outputs.cache-hit != 'true'
        with:
          path: .cache/WorkBuddy-5.9.3.exe
          key: workbuddy-win-5.9.3.42398134-d4692421
      - name: Install WorkBuddy 5.9.3
        shell: pwsh
        run: |
          $installer = Join-Path $PWD '.cache/WorkBuddy-5.9.3.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
          if (!$process.WaitForExit(180000)) { throw 'WorkBuddy installer did not exit within 3 minutes' }
          if ($process.ExitCode -ne 0) { throw "WorkBuddy installation failed: $($process.ExitCode)" }
          $cli = Join-Path $env:LOCALAPPDATA 'Programs/WorkBuddy/resources/app.asar.unpacked/cli/bin/codebuddy'
          if (!(Test-Path -LiteralPath $cli)) { throw "WorkBuddy CLI missing: $cli" }
          "ONECREW_TEST_GIT=$((Get-Command git.exe).Source)" >> $env:GITHUB_ENV
      - name: Install public Pro packages
        if: inputs.artifact_tag == ''
        shell: pwsh
        env:
          PRO_VERSION: ${{ inputs.pro_version }}
        run: |
          npm install --prefix .cache/candidate "@onecrew/pro@$env:PRO_VERSION" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix .cache/baseline '@onecrew/pro@0.1.27' --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native startup and WorkBuddy setup
        if: inputs.artifact_tag == ''
        env:
          ONECREW_TEST_VERSION: ${{ inputs.binary_version }}
        run: node --test tests/windows-setup.mjs
      - name: Download unpublished acceptance artifacts
        if: inputs.artifact_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        run: gh release download "$env:ARTIFACT_TAG" --dir .cache/artifacts
      - name: Install and verify unpublished Windows runtime
        if: inputs.artifact_tag != ''
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem .cache/artifacts/*.tgz | ForEach-Object FullName)
          npm install --prefix '.cache/候选 application' @packages --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix .cache/baseline '@onecrew/pro@0.1.26' --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ONECREW_TEST_CANDIDATE = Join-Path $PWD '.cache/候选 application/node_modules/@onecrew/pro-win32-x64'
          $env:ONECREW_TEST_ENTRY = Join-Path $PWD '.cache/候选 application/node_modules/@onecrew/pro/bin/onecrew-pro.cjs'
          $test = Join-Path $env:ONECREW_TEST_CANDIDATE 'app/windows-lifecycle.mjs'
          Copy-Item .cache/artifacts/windows-lifecycle.mjs $test
          $compiler = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /out:.cache/artifacts/windows-process-check.exe .cache/artifacts/windows-process-check.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sid = (& "$env:SystemRoot/System32/whoami.exe" /user /fo csv /nh | ConvertFrom-Csv -Header Name,Sid).Sid
          $node = (Get-Command node.exe).Source
          $runner = Join-Path $PWD '.cache/artifacts/windows-acceptance-runner.cjs'
          $escape = { param($s) [System.Security.SecurityElement]::Escape($s) }
          $xml = @"
          <?xml version="1.0" encoding="UTF-16"?>
          <Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
          <Principals><Principal id="User"><UserId>$sid</UserId><LogonType>InteractiveToken</LogonType><RunLevel>LeastPrivilege</RunLevel></Principal></Principals>
          <Settings><ExecutionTimeLimit>PT20M</ExecutionTimeLimit></Settings>
          <Actions Context="User"><Exec><Command>$(& $escape $node)</Command><Arguments>"$(& $escape $runner)" "$(& $escape $env:ONECREW_TEST_GIT)"</Arguments><WorkingDirectory>$(& $escape $PWD.Path)</WorkingDirectory></Exec></Actions>
          </Task>
          "@
          $xml | Set-Content .cache/acceptance-task.xml -Encoding Unicode
          schtasks.exe /Create /TN OneCrewAcceptance /XML .cache/acceptance-task.xml /F
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          schtasks.exe /Run /TN OneCrewAcceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deadline = (Get-Date).AddMinutes(16)
          while (!(Test-Path .cache/windows-acceptance-exit.json)) {
            if ((Get-Date) -gt $deadline) { throw 'Native acceptance timed out' }
            Start-Sleep -Seconds 3
          }
          Get-Content .cache/windows-acceptance-output.log
          $result = Get-Content .cache/windows-acceptance-exit.json | ConvertFrom-Json
          schtasks.exe /Delete /TN OneCrewAcceptance /F
          if ($result.error) { throw $result.error }
          exit $result.code
      - uses: actions/upload-artifact@v4
        if: always() && inputs.artifact_tag != ''
        with:
          name: windows-lifecycle-evidence
          path: |
            .cache/windows-lifecycle-report.json
            .cache/windows-acceptance-output.log
            .cache/Windows */**/server.log
            .cache/Windows */**/update.log
            .cache/Windows */**/state.json
            .cache/Windows */**/windows-task.json
